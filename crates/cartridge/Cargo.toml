[package]
name = "cartridge"
description = "A cartridge's contract as types and constants, the little a game needs to draw, and the macro that exports a game by the contract's names. no_std."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# A game's state lives in a static: a lock with a safe API keeps `unsafe` out.
spin = { version = "0.9", default-features = false, features = ["mutex", "spin_mutex"] }

# The workspace forbids `unsafe`. Here it is denied, and allowed on the
# declarations of `src/abi.rs` alone: the import of `tone` and the exports
# the `cart!` macro writes; a check holds it.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
