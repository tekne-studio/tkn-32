[package]
name = "cartridge-run"
description = "Runs a cartridge: prepares its file once (limits, a meter of work written into it) and holds it to the contract on any WebAssembly engine behind one trait."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cartridge.workspace = true
# wasmparser reads and validates a cartridge, wasm-encoder writes it back
# with its meter: the release of wasm-tools wasmi reads with.
wasmparser = { version = "0.228", default-features = false, features = ["std", "validate", "features"] }
wasm-encoder = { version = "0.228", default-features = false }

[lints]
workspace = true
