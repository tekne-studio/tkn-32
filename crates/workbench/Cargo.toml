[package]
name = "workbench"
description = "The arcade's workbench: one cartridge run on the browser's engine, stepped by a page that shows it from inside, its screen, palette, meter and memory."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cartridge.workspace = true
cartridge-run.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
cartridge-web.workspace = true
wasm-bindgen = "0.2"

[dev-dependencies]
cartridge-wasmi.workspace = true
wat = "1.228"

[lints]
workspace = true
