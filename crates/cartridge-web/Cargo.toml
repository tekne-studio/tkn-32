[package]
name = "cartridge-web"
description = "The browser's engine of a cartridge: its own WebAssembly behind cartridge-run's Instance, and the worker that runs a page's cartridges off its frame."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cartridge.workspace = true
cartridge-run.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

[dev-dependencies]
cartridge-test.workspace = true
cartridge-wasmi.workspace = true
wat = "1.228"
wasmparser = { version = "0.228", default-features = false, features = ["std"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

# The hostile and contract suites, files of cartridge-wasmi, run here on the
# browser's own WebAssembly: built to WebAssembly and run in node (V8) by
# wasm-bindgen-test-runner, each case on wasmi and on `Browser`, which must
# agree. Natively cartridge-wasmi runs them, so only a named run runs them
# here: `cargo test --target wasm32-unknown-unknown -p cartridge-web --test
# hostile --test contract`.
[[test]]
name = "hostile"
path = "../cartridge-wasmi/tests/hostile.rs"
test = false

[[test]]
name = "contract"
path = "../cartridge-wasmi/tests/contract.rs"
test = false

[lints]
workspace = true
