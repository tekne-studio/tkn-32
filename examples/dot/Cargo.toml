[package]
name = "dot"
description = "The smallest whole cartridge: a dot each pad moves. The guide's example, the one a new game is copied from; no version ships it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cartridge.workspace = true

# Its cover, cover.png, made the section `cartridge::cover!` places.
[build-dependencies]
cartridge-build.workspace = true

[dev-dependencies]
# Its test runs the game built to WebAssembly on wasmi and on the browser
# engines at hand.
cartridge-test.workspace = true
cartridge-run.workspace = true
cartridge-wasmi.workspace = true

# A cartridge writes no `unsafe`: it is denied, and allowed only on the
# exports `cartridge::cart!` writes.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
